<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Ángela Sánchez Díaz | Portafolio</title>
    <link rel="icon" type="image/x-icon" href="assets/icono1.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.cdnfonts.com/css/coolvetica-2');
        @import url('https://fonts.cdnfonts.com/css/cream-2');

        :root {
            --bg-main: #0a0a0c;
            --bg-alt: #111115;
            --text-main: #f3f4f6;
            --text-muted: #8e929b;
            --sidebar-bg: rgba(10, 10, 12, 0.85);
            --accent: #b57edc; 
            --accent-rgb: 181, 126, 220;
            --card-bg: #16161f;
            --border: rgba(255, 255, 255, 0.07);
            --modal-bg: #0a0a0c;
            --btn-close: invert(1);
            --btn-toggle-bg: var(--accent);
            --font-editorial: 'Cream', 'Plus Jakarta Sans', sans-serif;
            --font-titles: 'Coolvetica', sans-serif;
        }

        /* --- MANTENEMOS TUS ESTILOS ORIGINALES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-editorial); background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }
        
        /* Layout básico corregido */
        .main-content { margin-left: 280px; }
        section { padding: 140px 80px; position: relative; }
        
        /* --- VIDEOS (CORREGIDO Y UNIFICADO) --- */
        .videos-grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding: 20px 0;
            align-items: start;
        }

        .video-box-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .iframe-responsive-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 estándar */
            height: 0;
        }

        .iframe-responsive-wrapper.vertical {
            padding-bottom: 177.77%; /* TikTok vertical */
        }

        .iframe-responsive-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* Reutilizamos el resto de tus clases de Proyectos/UI/Carpetas */
        .projects-nav { display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--text-main); margin-bottom: 40px; }
        .tab-button { background-color: var(--card-bg); color: var(--text-muted); border: 2px solid transparent; padding: 12px 28px; cursor: pointer; border-radius: 10px 10px 0 0; }
        .tab-button.active { background-color: var(--accent); color: #0a0a0c; border: 2px solid var(--accent); }
        .tab-content-panel { display: none; }
        .tab-content-panel.active { display: block; }
        
        /* Carpeta y UI Grid igual que tenías */
        .folder-tabs-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .ui-grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }

        @media (max-width: 991px) {
            .main-content { margin-left: 0; }
            .videos-grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="tab-videos" class="tab-content-panel">
        <div class="videos-grid-container">
            <div class="video-box-card">
                <div class="iframe-responsive-wrapper">
                    <iframe src="https://www.youtube.com/embed/7V81M-Dmcpg" allowfullscreen></iframe>
                </div>
            </div>
            <div class="video-box-card">
                <div class="iframe-responsive-wrapper">
                    <iframe src="https://www.youtube.com/embed/rLvt3jiJG98" allowfullscreen></iframe>
                </div>
            </div>
            <div class="video-box-card" style="grid-column: span 2; max-width: 400px; margin: 0 auto;">
                <div class="iframe-responsive-wrapper vertical">
                    <iframe src="https://www.tiktok.com/embed/v2/7571610494839147798" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function switchProjectTab(event, targetTabId) {
            document.querySelectorAll('.tab-content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(targetTabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
