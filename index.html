<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Ángela Sánchez Díaz | Portafolio</title>
    <link rel="icon" type="image/x-icon" href="assets/icono1.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.cdnfonts.com/css/coolvetica-2');
        @import url('https://fonts.cdnfonts.com/css/cream-2');

        :root {
            --bg-main: #0a0a0c;
            --bg-alt: #111115;
            --text-main: #f3f4f6;
            --text-muted: #8e929b;
            --sidebar-bg: rgba(10, 10, 12, 0.85);
            --accent: #b57edc; 
            --accent-rgb: 181, 126, 220;
            --card-bg: #16161f;
            --border: rgba(255, 255, 255, 0.07);
            --modal-bg: #0a0a0c;
            --btn-close: invert(1);
            --btn-toggle-bg: var(--accent);
            --font-editorial: 'Cream', 'Plus Jakarta Sans', sans-serif;
            --font-titles: 'Coolvetica', sans-serif;
        }

        .contenedor-collage-libre { position: relative; width: 100%; height: 450px; margin: 0 auto; }
        .capa-img { position: absolute; pointer-events: none; will-change: transform; }
        .capa-fondo { z-index: 1; width: 140%; top: 35px; left: -850px; transform: scale(2.0); }
        .capa-medio { z-index: 2; width: 270%; top: -180px; right: -50px; left: auto; animation: flotarLibro 6s ease-in-out infinite; }
        .capa-frente { z-index: 3; width: 270%; top: -180px; right: -50px; left: auto; animation: flotarCartel 7s ease-in-out infinite; }

        @keyframes flotarLibro { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
        @keyframes flotarCartel { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(-1.5deg); } }

        [data-theme="light"] {
            --bg-main: #f8f9fa; --bg-alt: #ffffff; --text-main: #0f1115; --text-muted: #616670;
            --sidebar-bg: rgba(248, 249, 250, 0.9); --accent: #632ca6; --accent-rgb: 99, 44, 166;
            --card-bg: #f1f3f5; --border: rgba(0, 0, 0, 0.08); --modal-bg: #ffffff; --btn-close: invert(0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-editorial); background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.5s, color 0.5s; overflow-x: hidden; letter-spacing: -0.02em; }
        #preloader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-main); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s, visibility 0.8s; }
        #preloader img { width: 100vw; height: 100vh; object-fit: contain; }
        #preloader.fade-out { opacity: 0; visibility: hidden; }
        h1, h2, h3, h4, h5, h6, .display-title, .section-title, .brand-logo { font-family: var(--font-titles) !important; font-weight: 400 !important; }
        #custom-cursor { width: 24px; height: 24px; border: 2px solid var(--accent); border-radius: 50%; position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 9998; opacity: 0; }
        @media (pointer: coarse) { #custom-cursor { display: none; } }
        
        .sidebar { height: 100vh; width: 280px; position: fixed; top: 0; left: 0; background-color: var(--sidebar-bg); backdrop-filter: blur(20px); padding: 50px 35px; border-right: 1px solid var(--border); z-index: 1050; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.4s; }
        .sidebar.active { transform: translateX(0); }
        .brand-logo { font-size: 1.1rem; font-weight: 800; margin-bottom: 60px; text-transform: uppercase; }
        .brand-logo span { color: var(--accent); }
        .menu-toggle { display: flex; position: fixed; top: 25px; right: 25px; z-index: 1100; background: var(--btn-toggle-bg); border: none; width: 45px; height: 45px; border-radius: 50%; align-items: center; justify-content: center; cursor: pointer; }
        .main-content { margin-left: 280px; }
        section { padding: 140px 80px; position: relative; }
        #sobre-mi { min-height: 100vh; display: flex; align-items: center; background-image: linear-gradient(rgba(10, 10, 12, 0.85), rgba(10, 10, 12, 0.85)), url('assets/fondoSobreMi.png'); background-size: cover; }
        .display-title { font-size: 4.5rem; line-height: 1; margin-bottom: 15px; }
        .subtitle-tech { color: var(--accent); font-size: 1.2rem; text-transform: uppercase; }
        .skills-system-container { position: relative; width: 100%; height: 600px; display: flex; justify-content: center; align-items: center; }
        .skill-satellite-node { position: absolute; width: 110px; height: 110px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.4s; }
        .projects-nav { display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--text-main); margin-bottom: 40px; }
        .tab-button { background-color: var(--card-bg); color: var(--text-muted); border: none; padding: 12px 28px; cursor: pointer; }
        .tab-button.active { background-color: var(--accent); color: #0a0a0c; }
        .folder-tabs-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .folder-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; height: 320px; display: grid; grid-template-columns: 160px 1fr; text-decoration: none; color: inherit; }
        .ui-grid-container, .web-grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .ui-card-interactive { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
        .hover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 12, 0.85); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.4s; }
        
        /* --- AJUSTES PARA MÓVILES --- */
        @media (max-width: 991px) {
            .main-content { margin-left: 0; }
            section { padding: 80px 30px !important; }
            .folder-tabs-container, .ui-grid-container, .web-grid-container { grid-template-columns: 1fr; }
        }

        @media (max-width: 576px) {
            .display-title { font-size: 2.6rem !important; }
            .contenedor-collage-libre { height: 250px; transform: scale(0.8); }
            .skills-system-container { height: auto; flex-direction: column; gap: 20px; }
            .skill-satellite-node { position: static; width: 100%; max-width: 280px; height: auto; flex-direction: row; justify-content: flex-start; padding: 15px; }
            .skills-orbit-wrapper { display: none; }
            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="preloader"><img src="assets/animacionInicio.gif" alt="Cargando..." /></div>
    <div id="custom-cursor"></div>
    <button class="menu-toggle" id="menu-toggle-btn"><i class="fa-solid fa-bars" id="menu-icon"></i></button>

    <nav class="sidebar" id="sidebar-menu">
        <div class="brand-logo">Ángela S.<span>Díaz</span></div>
        <div class="nav-links-wrapper">
            <a href="#inicio" class="nav-link-custom">Inicio</a>
            <a href="#sobre-mi" class="nav-link-custom">Sobre Mí</a>
            <a href="#habilidades" class="nav-link-custom">Habilidades</a>
            <a href="#proyectos" class="nav-link-custom">Proyectos</a>
            <a href="#contacto" class="nav-link-custom">Contacto</a>
        </div>
    </nav>

    <div class="main-content">
        <section id="inicio">
            <div class="hero-container">
                <span class="subtitle-tech">Porfolio</span>
                <h1 class="display-title">Ángela Sánchez Díaz</h1>
            </div>
        </section>
        
        <section id="sobre-mi">
            <div class="about-text" style="text-align: justify;">
                <p>Soy estudiante de <strong>Diseño y Desarrollo de Videojuegos</strong>...</p>
            </div>
            <div class="contenedor-collage-libre">
                <img src="assets/estrellas.png" class="capa-img capa-fondo" alt="Estrellas">
                <img src="assets/libro.png" class="capa-img capa-medio" alt="Libro">
            </div>
        </section>

        <!-- El resto de tus secciones aquí -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lógica de menús y UI ya existente
        const toggleBtn = document.getElementById('menu-toggle-btn');
        const sidebar = document.getElementById('sidebar-menu');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('active'));
    </script>
</body>
</html>
